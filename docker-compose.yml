services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: carecredits
      POSTGRES_USER: carecredits
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carecredits -d carecredits"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://carecredits:${POSTGRES_PASSWORD}@postgres:5432/carecredits
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3010,http://127.0.0.1:3010,http://localhost:3020,http://127.0.0.1:3020,http://localhost:3021,http://127.0.0.1:3021,http://localhost:3030,http://127.0.0.1:3030,http://localhost:3040,http://127.0.0.1:3040}
      SCRAPER_SERVICE_TOKEN: ${SCRAPER_SERVICE_TOKEN:?Run scripts/setup_integrations.py}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_CONFIDENCE_FLOOR: ${JEV_CONFIDENCE_FLOOR:-0.7}
      CATALOGUE_AUTO_PUBLISH_NEW: ${CATALOGUE_AUTO_PUBLISH_NEW:-false}
      AGGREGATE_CREDIT_LABELS: ${AGGREGATE_CREDIT_LABELS:-CPD}
      MODEL_ID: ${MODEL_ID:-}
      MODEL_PUBLISHER: ${MODEL_PUBLISHER:-}
      MODEL_HOST: ${MODEL_HOST:-}
      MODEL_WEIGHTS_URL: ${MODEL_WEIGHTS_URL:-}
      MODEL_LICENSE_URL: ${MODEL_LICENSE_URL:-}
      MODEL_OPEN_WEIGHT_CONFIRMED: ${MODEL_OPEN_WEIGHT_CONFIRMED:-false}
      MODEL_MAX_INPUT_CHARS: ${MODEL_MAX_INPUT_CHARS:-}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-}
      MODEL_KEY_CONFIGURED: ${MODEL_API_KEY:+true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-true}
      DIGEST_LOG_DIR: ${DIGEST_LOG_DIR:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://127.0.0.1:8000}
      PUBLIC_FRONTEND_BASE: ${PUBLIC_FRONTEND_BASE:-http://127.0.0.1:3000}
      SCRAPER_HEALTH_URL: ${SCRAPER_HEALTH_URL:-http://scraper:8002}
      DAILY_SCRAPE_ENABLED: ${DAILY_SCRAPE_ENABLED:-true}
      DAILY_SCRAPE_JOB_CEILING: ${DAILY_SCRAPE_JOB_CEILING:-10}
      SCRAPE_TOPICS_FILE: ${SCRAPE_TOPICS_FILE:-/app/config/scrape_topics.json}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      SCRAPER_SERVICE_TOKEN: ${SCRAPER_SERVICE_TOKEN:?Run scripts/setup_integrations.py}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ID: ${MODEL_ID:-}
      MODEL_WEIGHTS_URL: ${MODEL_WEIGHTS_URL:-}
      MODEL_LICENSE_URL: ${MODEL_LICENSE_URL:-}
      MODEL_OPEN_WEIGHT_CONFIRMED: ${MODEL_OPEN_WEIGHT_CONFIRMED:-false}
      MODEL_MAX_INPUT_CHARS: ${MODEL_MAX_INPUT_CHARS:-}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-}
      MODEL_PUBLISHER: ${MODEL_PUBLISHER:-}
      MODEL_HOST: ${MODEL_HOST:-}
      FIREHOSE_MGMT_KEY: ${FIREHOSE_MGMT_KEY:-}
      SCRAPER_HEALTH_PORT: 8002
      SCRAPER_HEALTH_HOST: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready')"]
      interval: 30s
      start_period: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.demo
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
