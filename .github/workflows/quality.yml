name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Backend contract and regression tests
        env:
          PYTHONPATH: .:backend
        run: python scripts/test_backend.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Start isolated demo
        env:
          DATABASE_URL: sqlite:////tmp/carecredits-e2e.db
          DEMO_MODE: 'true'
          ALLOW_SIGNUP: 'true'
        run: |
          python scripts/dev.py --demo --backend-port 8111 --frontend-port 3111 > /tmp/carecredits-e2e.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3111/api/v1/config >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/carecredits-e2e.log
          exit 1
      - name: Browser regressions
        env:
          E2E_BASE_URL: http://127.0.0.1:3111
        run: npm run test:e2e
